<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
  </defs>

  <!-- card background so the figure reads in light and dark README themes -->
  <rect x="0" y="0" width="1000" height="400" rx="14" fill="#fcfcfb"/>

  <g font-size="13" fill="#52514e" text-anchor="middle">
    <!-- Inputs -->
    <rect x="20" y="25" width="180" height="170" rx="10" fill="#f1f0ec" stroke="#c9c8c3" stroke-width="1.5"/>
    <text x="110" y="52" font-size="15" font-weight="600" fill="#0b0b0b">Inputs</text>
    <text x="110" y="80">Image (img.png)</text>
    <text x="110" y="102">Liver mask</text>
    <text x="110" y="124">Camera K</text>
    <text x="110" y="146">CT model (.obj)</text>
    <text x="110" y="168">Real PLY (from image)</text>

    <!-- Encoder -->
    <rect x="240" y="60" width="150" height="100" rx="10" fill="#ffffff" stroke="#c9c8c3" stroke-width="1.5"/>
    <text x="315" y="100" font-size="15" font-weight="600" fill="#0b0b0b">Encoder</text>
    <text x="315" y="124">point fingerprints</text>
    <text x="315" y="142">(rotation-invariant)</text>

    <!-- Initial guess -->
    <rect x="430" y="60" width="150" height="100" rx="10" fill="#ffffff" stroke="#c9c8c3" stroke-width="1.5"/>
    <text x="505" y="100" font-size="15" font-weight="600" fill="#0b0b0b">Initial guess</text>
    <text x="505" y="124">rough pose + scale</text>
    <text x="505" y="142">(multi-start)</text>

    <!-- Rotate & deform -->
    <rect x="620" y="60" width="150" height="100" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
    <text x="695" y="100" font-size="15" font-weight="600" fill="#0b0b0b">Rotate &amp; deform</text>
    <text x="695" y="124">rigid + scale first,</text>
    <text x="695" y="142">then deformation</text>

    <!-- Prediction (output) -->
    <text x="895" y="50" font-size="11" letter-spacing="1.5" fill="#2a78d6">OUTPUT</text>
    <rect x="810" y="60" width="170" height="100" rx="10" fill="#e6f0fb" stroke="#2a78d6" stroke-width="2"/>
    <text x="895" y="100" font-size="15" font-weight="600" fill="#0b0b0b">Prediction</text>
    <text x="895" y="124">rotation R, translation t,</text>
    <text x="895" y="142">scale s, deformation</text>

    <!-- 3D -> 2D projection -->
    <rect x="810" y="260" width="170" height="100" rx="10" fill="#ffffff" stroke="#c9c8c3" stroke-width="1.5"/>
    <text x="895" y="300" font-size="15" font-weight="600" fill="#0b0b0b">3D → 2D mapping</text>
    <text x="895" y="324">project the posed,</text>
    <text x="895" y="342">deformed CT with K</text>

    <!-- Metric -->
    <rect x="560" y="260" width="210" height="100" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
    <text x="665" y="300" font-size="15" font-weight="600" fill="#0b0b0b">Metric</text>
    <text x="665" y="324">Dice · distance · plausibility</text>
    <text x="665" y="342">vs. mask &amp; real PLY</text>
  </g>

  <!-- main flow -->
  <g stroke="#52514e" stroke-width="1.8" fill="none">
    <line x1="200" y1="110" x2="236" y2="110" marker-end="url(#arrow)"/>
    <line x1="390" y1="110" x2="426" y2="110" marker-end="url(#arrow)"/>
    <line x1="580" y1="110" x2="616" y2="110" marker-end="url(#arrow)"/>
    <line x1="770" y1="110" x2="806" y2="110" marker-end="url(#arrow)"/>
    <line x1="895" y1="160" x2="895" y2="256" marker-end="url(#arrow)"/>
    <line x1="810" y1="310" x2="774" y2="310" marker-end="url(#arrow)"/>
  </g>

  <!-- optimization loop: metric feeds back into rotate & deform -->
  <line x1="695" y1="260" x2="695" y2="164" stroke="#2a78d6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-loop)"/>
  <text x="684" y="216" font-size="13" fill="#2a78d6" text-anchor="end">update &amp; repeat</text>

  <!-- legend -->
  <g font-size="13" fill="#52514e">
    <line x1="40" y1="300" x2="80" y2="300" stroke="#2a78d6" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="92" y="304">Optimization loop: repeat until the metric stops improving</text>
    <rect x="40" y="322" width="40" height="18" rx="4" fill="#e6f0fb" stroke="#2a78d6" stroke-width="2"/>
    <text x="92" y="336">What the model returns</text>
  </g>
</svg>
